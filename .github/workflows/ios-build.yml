name: Build iOS App (Unsigned – Sideloading)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 2.0.1)'
        required: true
        default: '2.0.0'
  push:
    tags:
      - "v*"
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      # ── 2. Python ─────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Homebrew build tools ────────────────────────────────────────────
      - name: Install Homebrew build dependencies
        run: |
          brew install autoconf automake libtool pkg-config
          brew link libtool
          gem install xcpretty --no-document 2>/dev/null || true

      # ── 4. kivy-ios + Cython ──────────────────────────────────────────────
      - name: Install kivy-ios and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kivy-ios>=1.4.0" "cython>=0.29"

      # ── 5. Cache compiled toolchain ───────────────────────────────────────
      #  *** MUST come before the toolchain build step so the cache is
      #  restored before we try to compile python3/kivy. ***
      - name: Cache kivy-ios compiled toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/kivy-ios
            dist/
            build/
          key: ${{ runner.os }}-kivyios-${{ hashFiles('ios/requirements.txt') }}-v4
          restore-keys: |
            ${{ runner.os }}-kivyios-

      # ── 6. Build toolchain (skipped if cache hit) ──────────────────────────
      - name: Build kivy-ios toolchain (python3 + kivy + ffmpeg)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss – building toolchain from source (takes ~20 min)…"
          toolchain build python3 kivy ffmpeg || toolchain build python3 kivy

      - name: Verify toolchain
        run: |
          echo "Toolchain dist contents:"
          ls dist/ || echo "(dist/ not present)"
          which toolchain
          toolchain recipes

      # ── 6.5. Comprehensive toolchain verification and recovery (handles all 3 error cases)
      - name: Comprehensive toolchain verification and recovery
        run: |
          echo "=== Comprehensive Toolchain Verification ==="
          
          # Case 1: Check if toolchain commands are available
          echo "Case 1: Verifying toolchain command availability..."
          if ! command -v toolchain &> /dev/null; then
            echo "ERROR: toolchain command not found"
            exit 1
          fi
          echo "✓ toolchain command available"
          
          # Case 2: Check for cache corruption - verify dist/ directory structure
          echo "Case 2: Checking for cache corruption..."
          if [ -d "dist" ]; then
            echo "Found dist/ directory, checking contents..."
            ls -la dist/
            if [ -z "$(ls -A dist/)" ]; then
              echo "ERROR: dist/ directory is empty (cache corruption)"
              echo "Cleaning corrupted cache and rebuilding..."
              rm -rf dist/ build/ ~/.cache/kivy-ios
              toolchain build python3 kivy ffmpeg || toolchain build python3 kivy
            else
              echo "✓ dist/ directory has content"
            fi
          else
            echo "dist/ directory not found, toolchain not built yet"
          fi
          
          # Case 3: Check for environment initialization - test toolchain pip
          echo "Case 3: Checking toolchain Python environment initialization..."
          if ! toolchain pip --version 2>&1; then
            echo "ERROR: toolchain pip not functional (environment initialization issue)"
            echo "Attempting to fix by rebuilding toolchain..."
            rm -rf dist/ build/
            toolchain build python3 kivy ffmpeg || toolchain build python3 kivy
            
            # Verify rebuild worked
            if ! toolchain pip --version 2>&1; then
              echo "ERROR: Toolchain rebuild failed to fix pip issue"
              echo "Detailed toolchain status:"
              toolchain recipes || true
              ls -la dist/ || true
              exit 1
            fi
          else
            echo "✓ toolchain pip is functional"
          fi
          
          # Additional verification: Check python3 recipe is compiled
          echo "Additional check: Verifying python3 recipe compilation..."
          if ! toolchain recipes | grep -q "python3.*compiled"; then
            echo "WARNING: python3 might not be properly compiled"
            echo "Rebuilding toolchain to ensure python3 is compiled..."
            rm -rf dist/ build/
            toolchain build python3 kivy ffmpeg || toolchain build python3 kivy
          else
            echo "✓ python3 recipe appears compiled"
          fi
          
          echo "=== Toolchain verification complete ==="

      # ── 7. Install pure-Python dependencies BEFORE project creation (avoids environment initialization issues)
      # requirements.txt contains only pure-Python packages (yt-dlp, plyer, …).
      # kivy and pyobjus are NOT listed there; they are compiled by the toolchain.
      - name: Install pure-Python dependencies
        run: |
          echo "=== Pre-installation diagnostics ==="
          echo "Current directory: $(pwd)"
          echo "Toolchain location: $(which toolchain)"
          echo "Dist directory contents:"
          ls -la dist/ || echo "No dist/ directory found"
          echo "Requirements file:"
          cat ios/requirements.txt
          
          echo "=== Upgrading pip in toolchain environment ==="
          toolchain pip install --upgrade pip
          
          echo "=== Installing requirements ==="
          toolchain pip install -r ios/requirements.txt
          
          echo "=== Post-installation verification ==="
          toolchain pip list

      # ── 8. Stage app files ─────────────────────────────────────────────────
      - name: Stage application files
        run: |
          mkdir -p ios_app
          cp ios/main.py        ios_app/
          cp ios/requirements.txt ios_app/
          cp ios/Info.plist     ios_app/

          if [ -d "ios/appicon/AppIcon.appiconset" ]; then
            cp -r ios/appicon/AppIcon.appiconset ios_app/
            echo "App icons staged."
          else
            echo "Warning: AppIcon.appiconset not found, default icon will be used."
          fi

          echo "Staged files:"
          ls -R ios_app/

      # ── 9. Create Xcode project ────────────────────────────────────────────
      - name: Create Xcode project via toolchain
        run: |
          toolchain create YTDownloader ios_app

          if [ ! -d "YTDownloader-ios" ]; then
            echo "Error: Xcode project was not created."
            ls -la
            exit 1
          fi
          echo "Xcode project created:"
          ls -la YTDownloader-ios/

      # ── 10. Apply Info.plist ────────────────────────────────────────────────
      - name: Apply custom Info.plist
        run: |
          TARGET="YTDownloader-ios/YTDownloader/Info.plist"
          if [ -f "ios_app/Info.plist" ]; then
            cp ios_app/Info.plist "$TARGET"
            echo "Info.plist applied."
          else
            echo "Warning: Info.plist not found."
          fi

      # ── 11. Apply app icon ────────────────────────────────────────────────
      - name: Configure app icon
        run: |
          cd YTDownloader-ios
          mkdir -p YTDownloader/Assets.xcassets
          if [ -d "../ios_app/AppIcon.appiconset" ]; then
            cp -r ../ios_app/AppIcon.appiconset YTDownloader/Assets.xcassets/
            echo "App icon configured."
          else
            mkdir -p YTDownloader/Assets.xcassets/AppIcon.appiconset
            echo "Default empty icon structure created."
          fi

      # ── 12. Verify dependencies are available in Xcode project ────────────────
      - name: Verify dependencies in Xcode project
        run: |
          echo "=== Verifying dependencies in Xcode project ==="
          cd YTDownloader-ios
          echo "Checking site-packages in the project..."
          find . -name "site-packages" -type d || echo "No site-packages found yet"
          echo "Project structure:"
          ls -la

      # ── 13. Build unsigned IPA ────────────────────────────────────────────
      - name: Build unsigned IPA
        working-directory: ./YTDownloader-ios
        run: |
          xcodebuild \
            -project YTDownloader.xcodeproj \
            -scheme  YTDownloader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true   # xcpretty for clean output; fall back to raw

      # ── 14. Package IPA ───────────────────────────────────────────────────
      - name: Package IPA for sideloading
        working-directory: ./YTDownloader-ios
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found."
            find build/ -name "*.app" || true
            exit 1
          fi

          echo "Found .app bundle: $APP_PATH"

          VERSION="${{ github.event.inputs.version || '2.0.0' }}"
          BUILD="${{ github.run_number }}"
          IPA_NAME="YTDownloader-${VERSION}-${BUILD}-unsigned.ipa"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "$IPA_NAME" Payload/
          rm -rf Payload/

          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "Created: $IPA_NAME ($(du -sh "$IPA_NAME" | cut -f1))"

      # ── 15. Upload IPA artifact ───────────────────────────────────────────
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-iOS-unsigned-${{ github.run_number }}
          path: YTDownloader-ios/${{ env.IPA_NAME }}
          retention-days: 90

      # ── 16. Build summary ─────────────────────────────────────────────────
      - name: Write build summary
        if: always()
        run: |
          {
            echo "## iOS Build Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | ${{ github.event.inputs.version || '2.0.0' }} |"
            echo "| Build # | ${{ github.run_number }} |"
            echo "| Type | Unsigned (sideloading) |"
            echo "| Status | ${{ job.status }} |"
            echo ""
            echo "### Install with"
            echo "- **AltStore** (recommended)"
            echo "- **SideStore**"
            echo "- **Sideloadly** (Windows / Linux)"
            echo ""
            echo "### Where to find downloaded files on device"
            echo "Files app → On My iPhone → YT Downloader"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 17. Upload build logs on failure ──────────────────────────────────
      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_number }}
          path: |
            YTDownloader-ios/build/
            ~/Library/Logs/xcodebuild*
          if-no-files-found: ignore
          retention-days: 7