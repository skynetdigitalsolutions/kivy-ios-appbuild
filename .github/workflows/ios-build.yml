name: Build iOS App (Unsigned – Sideloading)

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 2.0.1)'
        required: true
        default: '2.0.0'
  push:
    tags:
      - "v*"
    branches:
      - master
  pull_request:
    branches:
      - master

# Cancel in-progress runs for the same ref (saves runner minutes)
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

# ── Version single source of truth ────────────────────────────────────────────
env:
  APP_VERSION: ${{ github.event.inputs.version || '2.0.0' }}

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 120   # Reduced from 180 — gate script prevents runaway rebuilds

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Homebrew build tools ──────────────────────────────────────────────
      - name: Install Homebrew build dependencies
        run: |
          brew install autoconf automake libtool pkg-config
          brew link libtool

      # ── 4. kivy-ios + Cython ─────────────────────────────────────────────────
      - name: Install kivy-ios and Cython
        id: install-kivy-ios
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kivy-ios==2024.03.17" "cython>=0.29"
          VERSION=$(python -c "import kivy_ios; print(kivy_ios.__version__)" 2>/dev/null || echo "2024.03.17")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ── 5a. Cache: compiled toolchain dist/ (layer 1 — slow to build) ───────
      #   Key hashes toolchain.py (recipe list) + kivy-ios version.
      #   build/ is intentionally EXCLUDED — it is intermediate state that
      #   inflates the cache and is a common corruption source.
      - name: Cache kivy-ios compiled toolchain (dist/)
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: dist/
          key: ${{ runner.os }}-toolchain-${{ steps.install-kivy-ios.outputs.version }}-${{ hashFiles('ios/toolchain.py') }}-v1
          restore-keys: |
            ${{ runner.os }}-toolchain-${{ steps.install-kivy-ios.outputs.version }}-
            ${{ runner.os }}-toolchain-

      # ── 5b. Cache: pip packages (layer 2 — fast, changes with requirements) ──
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ios/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 6. Build toolchain (skipped on cache hit) ─────────────────────────
      - name: Build kivy-ios toolchain (hostpython3 + python3 + kivy + ffmpeg)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss – building toolchain from source (~20 min)…"
          toolchain build hostpython3 python3 kivy ffmpeg \
            || toolchain build hostpython3 python3 kivy

      # ── 7. Single-gate toolchain verification ────────────────────────────────
      #   Replaces the original 4-step cascade. Rebuilds once if corrupt;
      #   fails definitively after one retry. Sets TOOLCHAIN_OK=true.
      - name: Verify toolchain (single gate)
        run: |
          chmod +x scripts/toolchain_verify.sh
          bash scripts/toolchain_verify.sh

      # ── 8. Use existing icons (or generate if missing) ────────────────────
      - name: Ensure app icons are ready
        run: |
          if [ -d "ios/appicon/AppIcon.appiconset" ] && [ -f "ios/appicon/AppIcon.appiconset/Contents.json" ]; then
            echo "✓ Using existing committed AppIcon.appiconset"
          else
            echo "AppIcon.appiconset missing, generating from source..."
            pip install Pillow
            python ios/appicon/generate_icons.py \
              --source "favicon (1).ico" \
              --output ios/appicon
          fi

      # ── 9. Install pure-Python dependencies ──────────────────────────────────
      #   kivy and pyobjus are compiled by the toolchain — do NOT add them here.
      - name: Install pure-Python dependencies
        if: env.TOOLCHAIN_OK == 'true'
        run: |
          echo "=== Upgrading pip in toolchain environment ==="
          toolchain pip install --upgrade pip

          echo "=== Installing requirements ==="
          toolchain pip install -r ios/requirements.txt

          echo "=== Installed packages ==="
          toolchain pip list

      # ── 10. Stage application files ───────────────────────────────────────
      - name: Stage application files
        if: env.TOOLCHAIN_OK == 'true'
        run: |
          rm -rf ios_app
          mkdir -p ios_app

          # Entry point
          cp ios/main.py ios_app/

          # App package (modular structure)
          cp -r ios/app ios_app/app

          # Metadata
          cp ios/requirements.txt ios_app/
          cp ios/Info.plist       ios_app/

          # App icons
          if [ -d "ios/appicon/AppIcon.appiconset" ]; then
            cp -r ios/appicon/AppIcon.appiconset ios_app/
            echo "App icons staged."
          else
            echo "Warning: AppIcon.appiconset not found, default icon will be used."
          fi

          echo "--- Staged files ---"
          find ios_app/ -type f | sort

      # ── 11. Create Xcode project ───────────────────────────────────────────
      - name: Create Xcode project via toolchain
        if: env.TOOLCHAIN_OK == 'true'
        run: |
          toolchain create YTDownloader ios_app

          if [ ! -d "YTDownloader-ios" ]; then
            echo "Error: Xcode project was not created."
            ls -la
            exit 1
          fi
          echo "Xcode project created:"
          ls -la YTDownloader-ios/

      # ── 12. Apply custom Info.plist ───────────────────────────────────────
      - name: Apply custom Info.plist
        if: env.TOOLCHAIN_OK == 'true'
        run: |
          TARGET="YTDownloader-ios/YTDownloader/Info.plist"
          if [ -f "ios_app/Info.plist" ]; then
            cp ios_app/Info.plist "$TARGET"
            echo "Info.plist applied."
          else
            echo "Warning: Info.plist not found — using toolchain default."
          fi

      # ── 13. Configure app icon ─────────────────────────────────────────────
      - name: Configure app icon
        if: env.TOOLCHAIN_OK == 'true'
        run: |
          cd YTDownloader-ios
          mkdir -p YTDownloader/Assets.xcassets
          if [ -d "../ios_app/AppIcon.appiconset" ]; then
            cp -r ../ios_app/AppIcon.appiconset YTDownloader/Assets.xcassets/
            echo "App icon configured."
          else
            mkdir -p YTDownloader/Assets.xcassets/AppIcon.appiconset
            echo "Default empty icon structure created."
          fi

      # ── 14. Build unsigned IPA ─────────────────────────────────────────────
      - name: Build unsigned IPA
        if: env.TOOLCHAIN_OK == 'true'
        working-directory: ./YTDownloader-ios
        run: |
          xcodebuild \
            -project YTDownloader.xcodeproj \
            -scheme  YTDownloader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            APP_VERSION="${{ env.APP_VERSION }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -quiet || \
          xcodebuild \
            -project YTDownloader.xcodeproj \
            -scheme  YTDownloader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            APP_VERSION="${{ env.APP_VERSION }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # ── 15. Package IPA ────────────────────────────────────────────────────
      - name: Package IPA for sideloading
        if: env.TOOLCHAIN_OK == 'true'
        working-directory: ./YTDownloader-ios
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found."
            find build/ -name "*.app" || true
            exit 1
          fi

          echo "Found .app bundle: $APP_PATH"

          IPA_NAME="YTDownloader-${{ env.APP_VERSION }}-${{ github.run_number }}-unsigned.ipa"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "$IPA_NAME" Payload/
          rm -rf Payload/

          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "Created: $IPA_NAME ($(du -sh "$IPA_NAME" | cut -f1))"

      # ── 16. Upload IPA artifact ────────────────────────────────────────────
      - name: Upload unsigned IPA
        if: env.TOOLCHAIN_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-iOS-${{ env.APP_VERSION }}-unsigned-${{ github.run_number }}
          path: YTDownloader-ios/${{ env.IPA_NAME }}
          retention-days: 90

      # ── 17. Build summary ──────────────────────────────────────────────────
      - name: Write build summary
        if: always()
        run: |
          {
            echo "## iOS Build Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | ${{ env.APP_VERSION }} |"
            echo "| Build # | ${{ github.run_number }} |"
            echo "| Commit  | ${{ github.sha }} |"
            echo "| Type    | Unsigned (sideloading) |"
            echo "| Status  | ${{ job.status }} |"
            echo ""
            echo "### Install with"
            echo "- **AltStore** (recommended)"
            echo "- **SideStore**"
            echo "- **Sideloadly** (Windows / Linux)"
            echo ""
            echo "### Where to find downloaded files on device"
            echo "Files app → On My iPhone → YT Downloader"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 18. Upload build logs on failure ───────────────────────────────────
      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_number }}
          path: |
            YTDownloader-ios/build/
            ~/Library/Logs/xcodebuild*
          if-no-files-found: ignore
          retention-days: 7